<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingQswitch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231a8fe3'/%3E%3Cpath d='M10 9c1-1 3-1 4 1l1 3c0 1 0 2-1 2l-1 1c1 2 3 4 5 5l1-1c1-1 2-1 2-1l3 1c2 1 2 3 1 4l-2 2c-6 0-14-8-14-14z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="meet.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand-big"><span class="logo"></span><span class="brand-name">RingQswitch</span></div>
    <p class="muted" data-i18n>Sign in with your extension and web password</p>
    <label data-i18n>Extension<input id="login-user" name="username" autocomplete="username" placeholder="e.g. 1001 (or admin)" required></label>
    <label data-i18n>Web password<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
    <div id="login-error" class="error-text"></div>
    <button class="btn primary wide" type="submit" data-i18n>Sign in</button>
    <div id="login-sso" class="login-sso hidden"></div>
    <p class="muted small login-note" data-i18n>The web password is set by your administrator under Extensions. It is not your phone's SIP password.</p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside id="nav" class="side" aria-label="Menu">
    <div class="side-head">
      <a class="brand" href="#/dashboard"><span class="logo"></span><span class="brand-name">RingQswitch</span></a>
      <button id="collapse-btn" class="side-collapse" type="button" title="Collapse the menu" aria-label="Collapse the menu"></button>
    </div>
    <label class="side-search"><span id="search-icon"></span><input id="nav-search" data-i18n-attr="placeholder" type="search" placeholder="Search" autocomplete="off" aria-label="Search the menu"><kbd>Ctrl K</kbd></label>
    <nav id="nav-main" class="side-nav"></nav>
    <nav id="nav-bottom" class="side-nav side-bottom"></nav>
    <div class="side-user">
      <span id="side-avatar" class="avatar"></span>
      <div class="who"><b id="user-name"></b><span id="user-role"></span></div>
      <button id="logout-btn" class="icon-btn" type="button" title="Sign out" aria-label="Sign out"></button>
    </div>
  </aside>
  <div id="nav-shade" class="nav-shade"></div>
  <header class="top">
    <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Menu"></button>
    <a class="brand top-brand" href="#/dashboard"><span class="logo"></span><span class="brand-name">RingQswitch</span></a>
    <div class="top-right">
      <label class="domain-pick" title="Domain"><select id="domain-select" aria-label="Domain"></select></label>
      <a data-i18n-attr="title,aria-label" id="cal-btn" class="top-icon hidden" href="#/meetings" title="Meetings calendar" aria-label="Meetings calendar"></a>
      <button data-i18n-attr="title,aria-label" id="meet-btn" class="top-icon hidden" type="button" title="Meet" aria-label="Meet: start or join a video meeting"></button>
      <a data-i18n-attr="title,aria-label" id="chat-btn" class="top-icon hidden" href="#/chat" title="Chat" aria-label="Chat"><span id="chat-badge" class="top-badge hidden"></span></a>
      <button data-i18n-attr="title,aria-label" id="cache-btn" class="top-icon hidden" type="button" title="Clear the RingQswitch cache" aria-label="Clear the RingQswitch cache"></button>
      <a data-i18n-attr="title,aria-label" id="status-btn" class="top-icon hidden" href="#/callstatus" title="Call status" aria-label="Call status"></a>
      <a data-i18n-attr="title,aria-label" id="wall-btn" class="top-icon" href="#/wallboard" title="Wallboard" aria-label="Wallboard"></a>
      <button data-i18n-attr="title,aria-label" id="lang-btn" class="top-icon" type="button" title="Language" aria-label="Language" aria-haspopup="menu"></button>
      <div id="lang-menu" class="menu-pop lang-pop hidden" role="menu"></div>
      <button id="theme-btn" class="top-icon" type="button" title="Dark mode" aria-label="Dark mode"></button>
      <button id="user-btn" class="top-user" type="button" aria-haspopup="menu"><span id="top-avatar" class="avatar"><i id="top-presence" class="presence"></i></span><span id="top-name" class="top-name"></span></button>
      <div id="user-menu" class="menu-pop user-pop hidden" role="menu"></div>
    </div>
  </header>
  <main id="main" class="main"></main>
  <section id="phone" class="phone hidden" aria-label="Dialer"></section>
  <button id="phone-btn" class="fab hidden" type="button" title="Dialer" aria-label="Open the dialer"><span id="phone-dot" class="fab-dot"></span></button>
</div>

<audio id="phone-audio" autoplay></audio>
<div id="toast" class="toast hidden" role="status"></div>
<script src="icons.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="phone.js"></script>
<script src="livetr.js"></script>
<script src="phoneside.js"></script>
<script src="chat.js"></script>
<script src="more.js"></script>
<script src="people.js"></script>
<script src="meet.js"></script>
<script src="settings.js"></script>
<script src="topbar.js"></script>
<script src="callstatus.js"></script>
<script src="callflow.js"></script>
<script src="aiagents.js"></script>
<script src="phonekeys.js"></script>
<script src="officehours.js"></script>
<script src="security.js"></script>
<script src="hotel.js"></script>
<script src="efax.js"></script>
<script src="transcripts.js"></script>
<script src="integrations.js"></script>
<script src="start.js"></script>
</body>
</html>
